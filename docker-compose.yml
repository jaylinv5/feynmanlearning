version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: feynman-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: feynman123
      MYSQL_DATABASE: feynman
      MYSQL_USER: feynman
      MYSQL_PASSWORD: feynman123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/deploy/sql:/docker-entrypoint-initdb.d
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  redis:
    image: redis:7.0-alpine
    container_name: feynman-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass feynman123

  minio:
    image: minio/minio:latest
    container_name: feynman-minio
    restart: always
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

volumes:
  mysql_data:
  redis_data:
  minio_data: